name: Android TV and Fire TV
on:
  pull_request:
    paths: ['app/**', 'gradle/**', '*.gradle.kts', 'gradle.properties', 'gradlew*', '.github/workflows/android-tv.yml']
  push:
    branches: [main, 'codex/android-tv-*']
    paths: ['app/**', 'gradle/**', '*.gradle.kts', 'gradle.properties', 'gradlew*', '.github/workflows/android-tv.yml']
  workflow_dispatch:
permissions:
  contents: read
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: android-actions/setup-android@v3
      - run: sdkmanager "platforms;android-36" "build-tools;35.0.0"
      - uses: gradle/actions/setup-gradle@v4
      - run: chmod +x gradlew
      - run: ./gradlew testDebugUnitTest lintDebug assembleDebug assembleRelease bundleRelease
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: IPTV-Toronto-Android-build
          path: |
            app/build/outputs/apk/
            app/build/outputs/bundle/
            app/build/reports/tests/
            app/build/reports/lint-results-debug.html

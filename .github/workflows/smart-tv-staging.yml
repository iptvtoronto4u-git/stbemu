name: Smart TV Prototype Staging
on:
  push:
    branches: [main]
    paths:
      - 'smart-tv/**'
      - '.github/workflows/smart-tv-staging.yml'
  pull_request:
    paths: ['smart-tv/**', '.github/workflows/smart-tv-staging.yml']
  workflow_dispatch:
jobs:
  package:
    runs-on: ubuntu-24.04
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Validate JavaScript and manifests
        run: |
          node --check smart-tv/shared/app.js
          node --check smart-tv/shared/profile-utils.js
          node smart-tv/tests/profile-utils.test.js
          node --check smart-tv/shared/portal-provider.js
          node --check smart-tv/shared/tizen-player.js
          node --check smart-tv/shared/portal-diagnostics.js
          node smart-tv/tests/portal-diagnostics.test.js
          node smart-tv/tests/tizen-player.test.js
          node smart-tv/tests/portal-provider.test.js
          node --check smart-tv/relay/server.cjs
          node smart-tv/tests/relay.test.cjs
          python3 - <<'PY'
          import json, xml.etree.ElementTree as ET
          json.load(open('smart-tv/lg/appinfo.json'))
          ET.parse('smart-tv/samsung/config.xml')
          print('TV web app JavaScript and manifests validated')
          PY
      - name: Install Chromium browser test dependencies
        run: |
          npm install --no-save playwright@1.56.1
          npx playwright install --with-deps chromium
      - name: Run TV-sized browser smoke test
        run: |
          mkdir -p dist
          node smart-tv/tests/tv-browser-smoke.cjs
      - name: Stage Samsung and LG prototypes
        run: |
          mkdir -p dist/samsung dist/lg
          cp smart-tv/shared/{icon.png,index.html,style.css,app.js,profile-utils.js,relay-config.js,portal-provider.js,portal-diagnostics.js,tizen-player.js} dist/samsung/
          cp smart-tv/shared/{icon.png,index.html,style.css,app.js,profile-utils.js,relay-config.js,portal-provider.js,portal-diagnostics.js,tizen-player.js} dist/lg/
          cp smart-tv/samsung/config.xml smart-tv/samsung/build-and-install.ps1 dist/samsung/
          cp smart-tv/lg/appinfo.json dist/lg/
          (cd dist/samsung && zip -q -r ../IPTV-TORONTO-Tizen-source.zip .)
          (cd dist/lg && zip -q -r ../IPTV-TORONTO-webOS-source.zip .)
      - uses: actions/upload-artifact@v4
        with:
          name: IPTV-TORONTO-SmartTV-staging-source
          path: |
            dist/*.zip
            dist/*.png
          retention-days: 30

<!doctype html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>IPTV TORONTO</title><link rel="stylesheet" href="style.css"></head>
<body><main><header><h1>IPTV <span>TORONTO</span></h1><p>Smart TV • Authorized portal profiles</p></header><section id="home"><h2>Choose a profile</h2><div id="profiles" class="grid"></div><button id="add">+ Add portal profile</button><p id="status" role="status">Set up a profile to get started. Playback is not implemented in this prototype.</p></section><section id="editor" hidden><h2 id="editor-title">New profile</h2><form id="form"><label>Profile name<input id="name" maxlength="60" required placeholder="Living room"></label><label>Portal URL<input id="portal" type="url" required placeholder="https://provider.example/portal"></label><label>Registered MAC address<input id="mac" required placeholder="00:1A:79:XX:XX:XX"></label><div class="actions"><button type="submit">Save profile</button><button type="button" id="cancel">Cancel</button><button type="button" id="remove" hidden>Delete</button></div></form><p class="note">Only connect to services you are authorized to access. A portal URL and MAC do not automatically provide playback.</p></section><section id="browser" hidden><h2>Live TV</h2><button id="disconnect">Disconnect</button><button id="stop">Stop playback</button><p id="live-status" role="status"></p><div id="categories" class="grid"></div><div id="channels" class="grid"></div><button id="more" hidden>Next page</button></section></main><script type="text/javascript" src="$WEBAPIS/webapis/webapis.js"></script><script src="profile-utils.js"></script><script src="portal-provider.js"></script><script src="portal-diagnostics.js"></script><script src="tizen-player.js"></script><script src="app.js"></script></body></html>
